spring.application.name=ParkPie Backend

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://parkpie-db.postgres.database.azure.com:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=parkpieh1h1#

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
