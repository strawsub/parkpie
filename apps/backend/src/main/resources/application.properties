spring.application.name=ParkPie Backend

server.port=8080

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://parkpie-db.postgres.database.azure.com:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=parkpieh1h1#

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Debug use
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.jdbc=trace

# Actuator (check if db connected)
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Thymeleaf (for Admin Dashboard)
spring.thymeleaf.cache=false

# Multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Admin credentials
admin.username=admin
admin.password=parkpieh1h1#
