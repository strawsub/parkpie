<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ParkPie Admin Dashboard - Manage parking data and system health">
    <meta name="keywords" content="ParkPie, Admin, Dashboard, Parking, Management, Database">
    <meta name="author" content="ParkPie">
    <meta name="robots" content="noindex, nofollow">
    <title>ParkPie Admin - Dashboard</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/img/parkpie-logo.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Custom Admin CSS -->
    <link href="/css/admin.css" rel="stylesheet">
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/admin">
            <img src="/img/parkpie-logo.png" alt="ParkPie Logo">
            ParkPie Admin
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="/admin">
                        <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/database">
                        <i class="fas fa-database me-2"></i>Database
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/upload">
                        <i class="fas fa-upload me-2"></i>Upload
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/admin/scheduler">
                        <i class="fas fa-clock me-2"></i>Scheduler
                    </a>
                </li>
            </ul>

            <div class="navbar-nav">
                <form th:action="@{/logout}" method="post" class="d-inline m-0 p-0">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="nav-link logout-btn btn btn-link p-0">
                        <i class="fas fa-sign-out-alt me-2"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="main-content">
    <div class="container">
        <!-- Welcome Section -->
        <div class="welcome-section text-center">
            <div class="row">
                <div class="col-lg-8 mx-auto">
                    <h1>ParkPie Admin Dashboard</h1>
                    <p>Manage the parking data, monitor system health, and upload new dataset</p>
                </div>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="row g-4 mb-4">
            <div class="col-lg-3 col-md-6">
                <div class="stats-card">
                    <div class="icon parking">
                        <i class="fas fa-parking"></i>
                    </div>
                    <h3 th:text="${counts?.parking_signs ?: '0'}">0</h3>
                    <p>Parking Signs</p>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="stats-card">
                    <div class="icon bays">
                        <i class="fas fa-car"></i>
                    </div>
                    <h3 th:text="${counts?.parking_bays ?: '0'}">0</h3>
                    <p>Parking Bays</p>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="stats-card">
                    <div class="icon zones">
                        <i class="fas fa-map-marker-alt"></i>
                    </div>
                    <h3 th:text="${counts?.pay_stay_zone_links ?: '0'}">0</h3>
                    <p>Zone Links</p>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="stats-card">
                    <div class="icon restrictions">
                        <i class="fas fa-ban"></i>
                    </div>
                    <h3 th:text="${counts?.pay_stay_restrictions ?: '0'}">0</h3>
                    <p>Restrictions</p>
                </div>
            </div>
        </div>

        <!-- Quick Actions section removed -->
    </div>
</div>

<!-- Footer -->
<footer class="footer">
    <div class="container">
        <p class="mb-0">&copy; 2025 ParkPie. All rights reserved.</p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Add some interactivity
    document.addEventListener('DOMContentLoaded', function() {
        // Animate stats cards on scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        });

        document.querySelectorAll('.stats-card').forEach(card => {
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'all 0.6s ease';
            observer.observe(card);
        });
    });
</script>
</body>
</html>
