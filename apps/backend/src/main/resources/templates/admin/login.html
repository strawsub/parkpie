<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Login • ParkPie</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
        body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f6f7fb;margin:0}
        .card{max-width:360px;margin:12vh auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
        h1{font-size:20px;margin:0 0 12px}
        label{display:block;margin:12px 0 4px}
        input{width:100%;padding:10px 12px;border:1px solid #e2e4ea;border-radius:10px}
        button{width:100%;padding:12px;border:0;border-radius:10px;background:#5b7cfa;color:#fff;font-weight:600;margin-top:16px;cursor:pointer}
        .muted{color:#6b7280;font-size:12px;margin-top:12px}
        .msg{color:#ef4444;font-size:12px;margin:8px 0}
    </style>
</head>
<body>
<div class="card">
    <h1>ParkPie Admin</h1>
    <form th:action="@{/admin/login}" method="post">
        <div class="msg" th:if="${param.error}">Invalid username or password.</div>
        <div class="msg" th:if="${param.logout}">You have been logged out.</div>
        <label>Username</label>
        <input type="text" name="username" autofocus required/>
        <label>Password</label>
        <input type="password" name="password" required/>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit">Sign in</button>
        <div class="muted">Access restricted to administrators.</div>
    </form>
</div>
</body>
</html>
